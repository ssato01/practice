name: Auto Version Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Example: v1.2.3"
        required: false
        type: string

  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest version tag
        id: latest_tag
        run: |
          latest_tag=$(git tag --sort=-v:refname | grep '^v[0-9]\+\.[0-9]\+\.[0-9]\+$' | head -n 1)

          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Determine release version
        id: release_version
        run: |
          specified_version="${{ github.event.inputs.version }}"

          if [ -n "$specified_version" ]; then
            if ! echo "$specified_version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: version must be in vX.Y.Z format. Example: v1.2.3"
              echo "Specified version: $specified_version"
              exit 1
            fi

            release_version="$specified_version"
          else
            latest_tag="${{ steps.latest_tag.outputs.latest_tag }}"
            version="${latest_tag#v}"

            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)

            patch=$((patch + 1))

            release_version="v${major}.${minor}.${patch}"
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        run: |
          if git rev-parse "${{ steps.release_version.outputs.release_version }}" >/dev/null 2>&1; then
            echo "Error: tag already exists: ${{ steps.release_version.outputs.release_version }}"
            exit 1
          fi

      - name: Create and push version tag
        run: |
          git tag ${{ steps.release_version.outputs.release_version }}
          git push origin ${{ steps.release_version.outputs.release_version }}

      - name: Create GitHub Release
        run: |
          gh release create ${{ steps.release_version.outputs.release_version }} \
            --title "${{ steps.release_version.outputs.release_version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}